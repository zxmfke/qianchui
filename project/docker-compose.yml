version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: qianchui-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qianchui}
      POSTGRES_USER: ${POSTGRES_USER:-qianchui}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qianchui123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qianchui} -d ${POSTGRES_DB:-qianchui}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - qianchui-network

  redis:
    image: redis:7-alpine
    container_name: qianchui-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qianchui-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qianchui-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-qianchui}:${POSTGRES_PASSWORD:-qianchui123}@postgres:5432/${POSTGRES_DB:-qianchui}"
      REDIS_URL: "redis://redis:6379/0"
      SECRET_KEY: "${SECRET_KEY:-change-this-in-production-use-openssl-rand-hex-32}"
      LLM_PROVIDER: "${LLM_PROVIDER:-openai}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_API_BASE: "${LLM_API_BASE:-https://api.openai.com/v1}"
      LLM_MODEL: "${LLM_MODEL:-gpt-4}"
      LLM_HTTP_PROXY: "${LLM_HTTP_PROXY:-}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - qianchui-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: qianchui-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - qianchui-network

  nginx:
    image: nginx:alpine
    container_name: qianchui-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - qianchui-network

volumes:
  postgres_data:
  redis_data:

networks:
  qianchui-network:
    driver: bridge
